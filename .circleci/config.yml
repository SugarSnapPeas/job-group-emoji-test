version: 2.1

# Two job groups (emoji from each group's `name:`) next to a plain set of jobs
# with emoji in each job's own `name:`. All three share the same upstream
# (kickoff) and downstream (all-done). No matrix, no serial group.

executors:
  tiny:
    docker: [{image: cimg/base:current}]
    resource_class: small

jobs:
  kickoff:
    executor: tiny
    steps: [{run: echo kickoff}]
  work:
    executor: tiny
    parameters:
      item: {type: string}
    steps:
      - run: echo "<< parameters.item >>"
  all-done:
    executor: tiny
    steps: [{run: echo done}]

job-groups:
  herbs:
    jobs:
      - work: {name: basil, item: basil}
      - work: {name: chive, item: chive}
      - work: {name: dill, item: dill}
      - work: {name: mint, item: mint}
      - work: {name: oregano, item: oregano}
      - work: {name: parsley, item: parsley}
      - work: {name: sage, item: sage}
      - work: {name: thyme, item: thyme}
  dairy:
    jobs:
      - work: {name: brie, item: brie}
      - work: {name: cheddar, item: cheddar}
      - work: {name: feta, item: feta}
      - work: {name: gouda, item: gouda}
      - work: {name: havarti, item: havarti}
      - work: {name: manchego, item: manchego}
      - work: {name: ricotta, item: ricotta}
      - work: {name: swiss, item: swiss}

workflows:
  two-groups:
    jobs:
      - kickoff
      - herbs:
          name: "🌿 herbs"
          requires: [kickoff]
      - dairy:
          name: "🧀 dairy"
          requires: [kickoff]
      # No job group: emoji in each job's workflow name:, no start/end jobs
      - work:
          name: "🍎 orchard-apple"
          item: apple
          requires: [kickoff]
      - work:
          name: "🍎 orchard-apricot"
          item: apricot
          requires: [kickoff]
      - work:
          name: "🍎 orchard-cherry"
          item: cherry
          requires: [kickoff]
      - work:
          name: "🍎 orchard-fig"
          item: fig
          requires: [kickoff]
      - work:
          name: "🍎 orchard-peach"
          item: peach
          requires: [kickoff]
      - work:
          name: "🍎 orchard-pear"
          item: pear
          requires: [kickoff]
      - work:
          name: "🍎 orchard-plum"
          item: plum
          requires: [kickoff]
      - work:
          name: "🍎 orchard-quince"
          item: quince
          requires: [kickoff]
      - all-done:
          requires:
            - "🌿 herbs"
            - "🧀 dairy"
            - "🍎 orchard-apple"
            - "🍎 orchard-apricot"
            - "🍎 orchard-cherry"
            - "🍎 orchard-fig"
            - "🍎 orchard-peach"
            - "🍎 orchard-pear"
            - "🍎 orchard-plum"
            - "🍎 orchard-quince"
