version: 2.1

# Do two job groups with the same upstream and downstream render as separate
# stacks? No matrix, no serial group: each group's `name:` adds the emoji
# prefix to its jobs.

executors:
  tiny:
    docker: [{image: cimg/base:current}]
    resource_class: small

jobs:
  kickoff:
    executor: tiny
    steps: [{run: echo kickoff}]
  work:
    executor: tiny
    parameters:
      item: {type: string}
    steps:
      - run: echo "<< parameters.item >>"
  all-done:
    executor: tiny
    steps: [{run: echo done}]

job-groups:
  herbs:
    jobs:
      - work: {name: basil, item: basil}
      - work: {name: chive, item: chive}
      - work: {name: dill, item: dill}
      - work: {name: mint, item: mint}
      - work: {name: oregano, item: oregano}
      - work: {name: parsley, item: parsley}
      - work: {name: sage, item: sage}
      - work: {name: thyme, item: thyme}
  dairy:
    jobs:
      - work: {name: brie, item: brie}
      - work: {name: cheddar, item: cheddar}
      - work: {name: feta, item: feta}
      - work: {name: gouda, item: gouda}
      - work: {name: havarti, item: havarti}
      - work: {name: manchego, item: manchego}
      - work: {name: ricotta, item: ricotta}
      - work: {name: swiss, item: swiss}

workflows:
  two-groups:
    jobs:
      - kickoff
      - herbs:
          name: "🌿 herbs"
          requires: [kickoff]
      - dairy:
          name: "🧀 dairy"
          requires: [kickoff]
      - all-done:
          requires: ["🌿 herbs", "🧀 dairy"]
